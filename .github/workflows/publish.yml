name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练不真发（npm publish --dry-run）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $pkg 不一致。先改版本号提交，再打对应 tag。"
            exit 1
          fi

      - name: 该版本是否已发布
        id: published
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::手动 Run：跳过「已发布」检查，走演练流程"
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version 已在 npm 上，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.skip != 'true'
        run: pnpm build
      - if: steps.published.outputs.skip != 'true'
        run: pnpm lint
      - if: steps.published.outputs.skip != 'true'
        run: pnpm publint
      - if: steps.published.outputs.skip != 'true'
        run: pnpm attw

      - name: 发布到 npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public ${INPUTS_DRY_RUN}
        env:
          INPUTS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}

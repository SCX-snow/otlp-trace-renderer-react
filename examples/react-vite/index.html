<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      拒绝浏览器的「自动深色」（Chrome Auto Dark Theme / 安卓「Apply dark themes to sites」）：
      这是 Chrome 文档给的 opt-out 写法，放在 meta 里而不是 CSS 里，是为了避免先变暗再撤销的闪一下。
      页面自己有明暗开关（html.dark），所以这里只是「别替我变暗」，不代表没有深色模式。
      注意：DevTools → Rendering → Emulate auto dark mode 是**强制模拟**，会绕过这个声明（实测 meta / CSS
      `only light` / `color-scheme: light dark` 六种写法都拦不住），只有真实设置才认它。
    -->
    <meta name="color-scheme" content="only light" />
    <title>otlp-trace-renderer · example</title>
    <script>
      ;(() => {
        let saved = null
        try {
          saved = localStorage.getItem('otlp-example-theme')
        } catch {
          // 隐私模式下读 localStorage 会抛，忽略即可
        }
        const fromUrl = new URLSearchParams(location.search).get('theme')
        const dark =
          fromUrl === 'dark' || fromUrl === 'light'
            ? fromUrl === 'dark'
            : saved === 'dark' || saved === 'light'
              ? saved === 'dark'
              : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <style>
      :root {
        color-scheme: light;
        --app-bg: #f8fafc;
        --app-text: #0f172a;
        --app-border: #cbd5e1;
        --app-surface: #ffffff;
        --app-surface-strong: #e2e8f0;
        --app-surface-hover: #f1f5f9;
        --app-switch-track: #cbd5e1;
        --app-switch-knob: #ffffff;
      }

      html.dark {
        color-scheme: dark;
        --app-bg: #0b1220;
        --app-text: #e2e8f0;
        --app-border: #1e293b;
        --app-surface: #111a2b;
        --app-surface-strong: #1e293b;
        --app-surface-hover: #16233a;
        --app-switch-track: #334155;
        --app-switch-knob: #e2e8f0;
      }

      body {
        margin: 0;
        background: var(--app-bg);
        color: var(--app-text);
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #root {
        height: 100vh;
      }
      button {
        font: inherit;
        padding: 3px 10px;
        border: 1px solid var(--app-border);
        border-radius: 6px;
        background: var(--app-surface);
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: var(--app-surface-hover);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
